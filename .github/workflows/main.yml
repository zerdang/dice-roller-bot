name: CI

on:
  pull_request:
    branches: [main, feature/current-development]
  push:
    branches: [main, feature/current-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dice-roller-bot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bot.py
            standalone.py
            Dockerfile
            render.yaml
            .env.example
            cogs/
            functions/
            scripts/
            migrations/
            models/
            ui/
            web/
            requirements.txt
            README.md
            LICENSE

  render-container:
    name: Render container build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag dice-roller-tabletop:${{ github.sha }} .
